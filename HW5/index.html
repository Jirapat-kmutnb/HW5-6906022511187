<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Acoustics - หน้าหลัก</title>
    <link rel="stylesheet" href="css/gridstyle.css">
</head>
<body>

    <div class="grid-container">
        <!-- Header -->
        <header>
            <img src="images/header.jpg" alt="AURA Header Logo">
        </header>

        <!-- Navigation -->
        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
        </nav>

        <!-- Main Content Area -->
        <main>
            <section class="content-box">
                <h2>ยินดีต้อนรับสู่ร้านของเรา</h2>
                <p>เรามีสินค้าหลากหลายและราคาพิเศษสำหรับคุณ</p>
                <img src="images/shop.jpg" alt="บรรยากาศภายในร้าน AURA">
            </section>

            <section class="content-box">
                <h2>ร้านอยู่จังหวัดปราจีนบุรี</h2>
                <p>การเดินทางสะดวกเข้าได้สองทาง</p>
                <img src="images/map.png" alt="แผนที่ร้านจังหวัดปราจีนบุรี">
            </section>
        </main>

        <!-- Sidebar / Register Form -->
        <aside>
            <h3>สมัครสมาชิก</h3>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="firstname">ชื่อ</label>
                    <input type="text" id="firstname" name="firstname" placeholder="ชื่อจริง">
                </div>

                <div class="form-group">
                    <label for="lastname">นามสกุล</label>
                    <input type="text" id="lastname" name="lastname" placeholder="นามสกุล">
                </div>

                <div class="form-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com">
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" placeholder="อย่างน้อย 8 ตัวอักษร">
                </div>

                <div class="form-group">
                    <label for="confirm-password">ยืนยันรหัสผ่าน</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="ยืนยันรหัสผ่าน">
                </div>

                <div class="form-group">
                    <label for="phone">เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" name="phone" placeholder="083-xxx-xxxx">
                </div>

                <div class="form-group">
                    <label>เพศ</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male"> ชาย</label>
                        <label><input type="radio" name="gender" value="female"> หญิง</label>
                        <label><input type="radio" name="gender" value="other"> ไม่ระบุ</label>
                    </div>
                </div>

                <div class="checkbox-group">
                    <label><input type="checkbox" name="newsletter"> รับข่าวสาร</label>
                    <label><input type="checkbox" name="newsletter"> โปรโมชั่น</label>
                    <label><input type="checkbox" name="newsletter"> กิจกรรม</label>
                </div>

                <div class="form-group">
                    <label for="member-type">ประเภทสมาชิก</label>
                    <select id="member-type" name="member-type">
                        <option value="normal">Normal</option>
                        <option value="vip">VIP</option>
                        <option value="premium">Premium</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <label><input type="checkbox" name="agree" required> ยอมรับข้อกำหนดและเงื่อนไข</label>
                </div>

                <button type="submit" class="submit-btn">สมัครสมาชิก</button>
                <p class="form-footer-note">เราจะเก็บข้อมูลของคุณเป็นความลับ</p>
            </form>
        </aside>

        <!-- Footer -->
        <footer>
            <img src="images/footer.jpg" alt="AURA Footer & Payment Options">
        </footer>
    </div>

</body>
</html>
